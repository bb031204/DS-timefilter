# TimeFilter 金融实验配置：修改后运行 python scripts/run_financial.py 即可。
# 路径相对于 TimeFilter 项目目录；命令行同名参数会覆盖本文件。
# 当前金融实验保留已有归一化、排序损失和模型候选参数；本轮新增 RankIC 选模与梯度诊断。
# 同参数、同代码、同数据的已完成实验会复用结果；旧实验无版本指纹，首次重新运行不会复用。
# 原始 TimeFilter 参数（本仓库 run.py 默认值，不代表论文对所有数据集的最优配置）：
#   预测：seq_len=96，label_len=48，pred_len=96。
#   模型：d_model=512，d_ff=2048，n_heads=4，e_layers=2，patch_len=16，
#         alpha=0.1，top_p=0.5，dropout=0.1，pos=1，归一化开启。
#   训练：batch_size=32，train_epochs=10，learning_rate=0.0001，patience=3，
#         lradj=cosine，itr=1，moe_aux_weight=0.05；原始模型无 RankLoss（等价 rank_weight=0）。
#   运行：num_workers=1，gpu=0。金融专用项 financial_seed=2021（原脚本也固定种子 2021）、
#         financial_selection=mse、cpu=false 是适配配置，不能视为原模型超参数。
# 最早 SP500 金融基线另使用：seq_len=16，label_len=0，pred_len=1，train_epochs=100，num_workers=0；
# 其余上述模型/训练参数与原始默认一致，金融归一化仍开启，排序损失未启用。
dataset: SP500  # 市场：SP500（也接受 S&P500）、NASDAQ、NYSE
data_root: stockmixer_dataset  # 数据父目录，其下应有对应市场的子目录
mode: train  # train：从头训练并测试最佳权重；evaluate：只测试已有权重
checkpoint: null  # evaluate 时填写训练输出目录内的 best.pth；会核对原实验配置

# 预测任务
forecast:
  seq_len: 16  # 原始默认 96；当前输入 16 个交易日，须能被 patch_len 整除
  label_len: 0  # 原始默认 48；当前金融任务不使用解码器历史标签
  pred_len: 1  # 原始默认 96；当前金融任务预测下一交易日

# 模型超参数
model:
  d_model: 512  # 隐藏特征维度，需能被 n_heads 整除；越大通常越占显存
  d_ff: 2048  # 前馈网络中间维度
  n_heads: 4  # 图关系学习的头数
  e_layers: 2  # 图网络层数
  patch_len: 8  # 原始默认及 SP500 基线 16；当前 8，每股 2 个 patch
  alpha: 0.3  # 原始默认及 SP500 基线 0.1；当前候选值仍需验证集对照
  top_p: 0.5  # MoE 路由累计概率阈值；本次保持不变，不用它关闭辅助损失
  dropout: 0.1  # Dropout 概率，用于正则化
  pos: 1  # 位置编码开关：1 开启，0 关闭
  norm: false  # 原始行为及 SP500 基线为 true；当前仅金融任务绕过归一化及反归一化

# 训练与验证集选模
training:
  # 金融总损失 = 预测 MSE + rank_weight × 横截面排序损失 + moe_aux_weight × MoE 辅助损失。
  # 设为 0 仍保留 MoE 路由和模型结构；不同权重实验不要按总 Train Loss 大小评优。
  moe_aux_weight: 0.005  # 原始默认及 SP500 基线 0.05；当前为 0.005
  rank_weight: 0.1  # 原始无 RankLoss，等价于 0；当前 0.1 为 StockMixer 参考候选
  financial_seed: 2021  # 随机种子；三组使用相同种子，后续复验时再成组更换
  financial_selection: RankIC  # 仅用验证集选 best.pth：RankIC 越高越好；可改回 mse / IC
  gradient_diagnostic_epochs: [0, 1, 5]  # 只检查训练早期：训练前、第 1 / 5 轮后；[] 关闭诊断
  gradient_diagnostic_batch_size: 8  # 固定取训练期均匀分布的 8 个日期；显存允许时可改为 32
  batch_size: 32  # 每批历史窗口数；显存不足可减小，但所有对照组需一致
  train_epochs: 100  # 原始默认 10；SP500 基线 100。金融流程跑满后使用验证集最优 best.pth
  learning_rate: 0.0001  # Adam 初始学习率
  patience: 3  # 原框架早停参数；当前金融流程不启用早停，此值不影响训练轮数
  lradj: cosine  # 学习率调度：cosine（当前）、type1、type2
  itr: 1  # 单次启动的训练次数；建议保持 1，多种子实验应显式更换 financial_seed

# 运行设备
runtime:
  num_workers: 0  # 原始默认 1；SP500 基线 0。Windows 建议保持 0
  gpu: 0  # 使用的 GPU 编号，从 0 开始
  cpu: false  # true 强制使用 CPU；false 在 CUDA 可用时使用 GPU
