# Unified financial experiment. Paths are relative to this project directory.
dataset: SP500  # SP500 (or S&P500), NASDAQ, NYSE
data_root: stockmixer_dataset
mode: train  # train or evaluate
checkpoint: null  # evaluate: absolute path to an existing checkpoint.pth
forecast:
  seq_len: 16
  label_len: 0
  pred_len: 1
model:
  d_model: 512
  d_ff: 2048
  n_heads: 4
  e_layers: 2
  patch_len: 16
  alpha: 0.1
  top_p: 0.5
  dropout: 0.1
  pos: 1
training:
  financial_seed: 2021
  financial_selection: mse  # mse (min), RankIC or IC (max); validation only
  batch_size: 32
  train_epochs: 100
  learning_rate: 0.0001
  patience: 3
  lradj: cosine
  itr: 1
runtime:
  num_workers: 0
  gpu: 0
  cpu: false
